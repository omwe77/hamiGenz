name: CI

on:
  push:
    branches:
      - main
      - dev
      - 'chore/**'
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Enforce least-privilege token permissions
permissions:
  contents: read

# Cancel in-progress runs for the same branch or PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI (Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies (Tesseract OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-nep

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r requirements.txt httpx==0.28.1

      - name: Run deterministic regression & evaluation tests (Default Rate Limits)
        env:
          TRANSFORMERS_OFFLINE: '1'
          HF_HUB_OFFLINE: '1'
        run: |
          pytest \
            tests/test_railway_ip_and_health.py \
            tests/test_phase1_security.py \
            tests/test_security.py \
            tests/test_gemini_provider.py \
            tests/test_actions.py \
            tests/test_forms.py \
            tests/test_official_answer.py \
            tests/test_prompt_guard.py \
            tests/test_source_registry.py \
            tests/test_okf.py \
            tests/test_concurrency.py \
            tests/test_reindex_safety.py \
            tests/test_fill_image.py \
            tests/test_evaluation.py \
            tests/test_pipeline.py::TestLanguageDetector \
            tests/test_pipeline.py::TestTextCleaner \
            tests/test_pipeline.py::TestChunker \
            tests/test_offline_embedding_mock.py \
            -v

      - name: Run Phase 1.1 security tests under default rate limits
        env:
          TRANSFORMERS_OFFLINE: '1'
          HF_HUB_OFFLINE: '1'
        run: |
          pytest tests/test_phase1_1_corrections.py -k "not TestCompleteRouteAuthorizationMatrix" -v

      - name: Run complete route authorization matrix (Elevated test-only limits)
        env:
          TRANSFORMERS_OFFLINE: '1'
          HF_HUB_OFFLINE: '1'
          RATE_LIMIT_UPLOAD_IP: '500/60'
          RATE_LIMIT_UPLOAD_SESSION: '500/60'
        run: |
          pytest tests/test_phase1_1_corrections.py -k "TestCompleteRouteAuthorizationMatrix" -v

  frontend-ci:
    name: Frontend CI (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit & CSP tests
        run: npm test

      - name: Run linter
        run: npm run lint

      - name: Build Next.js application
        run: npm run build

  docker-validation:
    name: Docker Validation (Root Context)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Docker build
        run: |
          docker build -t hamigenz-backend:ci .
          docker image inspect hamigenz-backend:ci --format 'Image Size: {{.Size}} bytes'
